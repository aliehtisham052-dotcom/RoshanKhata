# The Android version Robolectric simulates for every test in this module.
#
# 34, not the app's targetSdk of 36: Robolectric's SDK 36 jars are compiled
# with Java 21, and CI builds with JDK 17 (build.yml, setup-java). Asking for
# 36 here would fail every Robolectric test before it started. Nothing these
# tests check - Activity startup, Room/SQLite, org.json - differs between 34
# and 36. Move this to 36 in the same commit that moves CI to JDK 21.
sdk=34
