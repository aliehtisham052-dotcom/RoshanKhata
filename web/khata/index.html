<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Roshan Khata</title>
<style>
  :root {
    --bg: #f4f6f4; --card: #ffffff; --ink: #18211c; --muted: #5d6b63; --line: #e2e8e4;
    --green: #1a7f50; --red: #b3261e; --chip: #eef5f1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101412; --card: #1a201d; --ink: #e8efea; --muted: #a3b2a9; --line: #2c3631; --green: #5fd9a3; --red: #ff8a80; --chip: #22302a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body.nastaliq { font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", system-ui, sans-serif; line-height: 1.9; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .shop { font-size: 14px; color: var(--muted); margin: 0 0 4px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .label { font-size: 14px; color: var(--muted); margin: 0; }
  .amount { font-size: 34px; font-weight: 700; margin: 2px 0 2px; }
  .owe { color: var(--red); } .clear { color: var(--green); }
  ul { list-style: none; padding: 0; margin: 18px 0 0; border-top: 1px solid var(--line); }
  li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .when { font-size: 13px; color: var(--muted); }
  .what { font-size: 14px; unicode-bidi: plaintext; }
  .sum { font-weight: 600; white-space: nowrap; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--chip); margin-top: 2px; }
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; }
  .foot .brand { direction: ltr; unicode-bidi: isolate; }
  .msg { text-align: center; color: var(--muted); padding: 24px 0 0; margin: 0; }
  .msg.en { padding-top: 8px; font-size: 14px; }
  #page > .msg:last-child { padding-bottom: 24px; }
</style>
</head>
<body>
<main>
  <div class="card" id="page"><p class="msg">Loading…</p></div>
  <p class="foot" id="foot">Roshan Khata · Innovation-313</p>
</main>
<script src="view.js"></script>
</body>
</html>
