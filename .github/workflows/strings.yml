# The two string failures the Android build never catches:
# a key missing from a locale (silent English fallback) and a
# placeholder mismatch (runtime crash, only in that language).
# scripts/check_strings.py explains both; this just runs it on
# every push and pull request. Seconds, no dependencies.
name: Strings

on:
  push:
    paths:
      - 'app/src/main/res/values*/strings.xml'
      - 'app/src/main/res/values*/arrays.xml'
      - 'scripts/check_strings.py'
      - '.github/workflows/strings.yml'
      # Dark-mode colour guard: any layout, drawable, colour or theme change.
      - 'app/src/main/res/layout/**'
      - 'app/src/main/res/drawable*/**'
      - 'app/src/main/res/color/**'
      - 'app/src/main/res/values*/colors.xml'
      - 'app/src/main/res/values/themes.xml'
      - 'scripts/check_dark_colours.py'
      - 'scripts/check_dark_pairs.py'
      - 'scripts/check_pdf_rtl.py'
      - 'scripts/check_icon_direction.py'
      - 'scripts/check_icon_fit.py'
      - 'app/src/main/res/mipmap-*/**'
      - 'app/src/main/res/drawable-nodpi/splash_logo.webp'
      - 'app/src/main/java/**'
      # check_pdf_rtl.py scans shared/src too (R103, 23 Oct 2026).
      - 'shared/src/**'
      # The computer's copies of the phone's designs (gen_desktop_*.py --check).
      - 'scripts/gen_desktop_*.py'
      - 'desktop/src/main/kotlin/**'
      # Hudhud's sentence bank, written into the tests' resources (gen_hudhud_bank.py --check).
      - 'shared/hudhud/**'
      - 'scripts/gen_hudhud_bank.py'
      # Hudhud only reads (check_hudhud_readonly.py).
      - 'scripts/check_hudhud_readonly.py'
      # Hudhud's engine answers a typed question offline (check_hudhud_offline.py; hard-zero gate, Marhala 3).
      - 'scripts/check_hudhud_offline.py'
      # Hudhud's data manifest, rights register and decision log (hudhud_manifest.py --check; governance, Marhala 12):
      # any data file of his in any module (the model in the assets too), the script and the hash helper it shares.
      - '**/hudhud/**'
      - 'scripts/hudhud_manifest.py'
      # Hudhud's glossary: the engine's concept words by concept and language, for a native read (hudhud_glossary.py --check;
      # Marhala 11 item 5). HudhudMind.kt itself is under shared/src/**.
      - 'scripts/hudhud_glossary.py'
      - 'docs/hudhud-glossary.tsv'
      # Marhala 2 tools: the check-log triage's tests and the on-device speed sample (hudhud_speed_sample.py --check).
      - 'scripts/hudhud_checklog.py'
      - 'scripts/test_hudhud_checklog.py'
      - 'scripts/hudhud_speed_sample.py'
      - 'app/src/androidTest/assets/hudhud/**'
      - 'scripts/hudhud_model_card.py'
      - 'scripts/gen_viewer_dao.py'
      # Hudhud's catalog: every stored column, screen, tile and More entry has a decision (gen_hudhud_catalog.py --check).
      - 'scripts/gen_hudhud_catalog.py'
      # Every column is in the backup and a helper's copy holds the owner's private ones back (check_book_columns.py).
      - 'scripts/check_book_columns.py'
      # The bug-class register: every class found, its guard and the test that holds it (check_bug_classes.py).
      - 'docs/bug-classes.tsv'
      - 'scripts/check_bug_classes.py'
      # No real phone number in the public repository; no Room alias that is an SQL keyword (BC-077, BC-078).
      - 'scripts/check_invented_numbers.py'
      - 'scripts/check_word_keys.py'
      - 'scripts/check_room_aliases.py'
      # Gates only tighten; release jobs hold no secrets; nothing ignored is tracked; CSV reads are decoded (BC-192..195, 223, 225).
      - 'scripts/check_dao_gates.py'
      - 'scripts/check_repo_guards.py'
      - 'scripts/check_main_thread.py'
      - 'scripts/check_capability_matrix.py'
      - 'scripts/check_data_flows.py'
      - 'scripts/check_formula_book.py'
      - 'scripts/gen_covering_array.py'
      - 'docs/covering-array.tsv'
      - 'docs/formula-book.tsv'
      - '.github/workflows/**'
      # Hudhud's sentence sets: one JSONL view and a quality gate (hudhud_sets.py --check, T27).
      - 'scripts/hudhud_sets.py'
      - 'scripts/hudhud_sets_overlap.tsv'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'
      - 'desktop/src/test/**'
      - 'docs/**'
      # The shared harness's file lists (scripts/shared_harness/run.sh --lists-only).
      - 'scripts/shared_harness/**'
  pull_request:
    paths:
      - 'app/src/main/res/values*/strings.xml'
      - 'app/src/main/res/values*/arrays.xml'
      - 'scripts/check_strings.py'
      - '.github/workflows/strings.yml'
      # Dark-mode colour guard: any layout, drawable, colour or theme change.
      - 'app/src/main/res/layout/**'
      - 'app/src/main/res/drawable*/**'
      - 'app/src/main/res/color/**'
      - 'app/src/main/res/values*/colors.xml'
      - 'app/src/main/res/values/themes.xml'
      - 'scripts/check_dark_colours.py'
      - 'scripts/check_dark_pairs.py'
      - 'scripts/check_pdf_rtl.py'
      - 'scripts/check_icon_direction.py'
      - 'app/src/main/java/**'
      # check_pdf_rtl.py scans shared/src too (R103, 23 Oct 2026).
      - 'shared/src/**'
      # The computer's copies of the phone's designs (gen_desktop_*.py --check).
      - 'scripts/gen_desktop_*.py'
      - 'desktop/src/main/kotlin/**'
      # Hudhud's sentence bank, written into the tests' resources (gen_hudhud_bank.py --check).
      - 'shared/hudhud/**'
      - 'scripts/gen_hudhud_bank.py'
      # Hudhud only reads (check_hudhud_readonly.py).
      - 'scripts/check_hudhud_readonly.py'
      # Hudhud's engine answers a typed question offline (check_hudhud_offline.py; hard-zero gate, Marhala 3).
      - 'scripts/check_hudhud_offline.py'
      # Hudhud's data manifest, rights register and decision log (hudhud_manifest.py --check; governance, Marhala 12):
      # any data file of his in any module (the model in the assets too), the script and the hash helper it shares.
      - '**/hudhud/**'
      - 'scripts/hudhud_manifest.py'
      # Hudhud's glossary: the engine's concept words by concept and language, for a native read (hudhud_glossary.py --check;
      # Marhala 11 item 5). HudhudMind.kt itself is under shared/src/**.
      - 'scripts/hudhud_glossary.py'
      - 'docs/hudhud-glossary.tsv'
      # Marhala 2 tools: the check-log triage's tests and the on-device speed sample (hudhud_speed_sample.py --check).
      - 'scripts/hudhud_checklog.py'
      - 'scripts/test_hudhud_checklog.py'
      - 'scripts/hudhud_speed_sample.py'
      - 'app/src/androidTest/assets/hudhud/**'
      - 'scripts/hudhud_model_card.py'
      - 'scripts/gen_viewer_dao.py'
      # Hudhud's catalog: every stored column, screen, tile and More entry has a decision (gen_hudhud_catalog.py --check).
      - 'scripts/gen_hudhud_catalog.py'
      # The bug-class register: every class found, its guard and the test that holds it (check_bug_classes.py).
      - 'docs/bug-classes.tsv'
      - 'scripts/check_bug_classes.py'
      # No real phone number in the public repository; no Room alias that is an SQL keyword (BC-077, BC-078).
      - 'scripts/check_invented_numbers.py'
      - 'scripts/check_word_keys.py'
      - 'scripts/check_room_aliases.py'
      # Gates only tighten; release jobs hold no secrets; nothing ignored is tracked; CSV reads are decoded (BC-192..195, 223, 225).
      - 'scripts/check_dao_gates.py'
      - 'scripts/check_repo_guards.py'
      - 'scripts/check_main_thread.py'
      - 'scripts/check_capability_matrix.py'
      - 'scripts/check_data_flows.py'
      - 'scripts/check_formula_book.py'
      - 'scripts/gen_covering_array.py'
      - 'docs/covering-array.tsv'
      - 'docs/formula-book.tsv'
      - '.github/workflows/**'
      # Hudhud's sentence sets: one JSONL view and a quality gate (hudhud_sets.py --check, T27).
      - 'scripts/hudhud_sets.py'
      - 'scripts/hudhud_sets_overlap.tsv'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'
      - 'desktop/src/test/**'
      - 'docs/**'
      # The shared harness's file lists (scripts/shared_harness/run.sh --lists-only).
      - 'scripts/shared_harness/**'

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: String parity across 9 locales
        run: python3 scripts/check_strings.py
      - name: Dark-mode colours keep one job (text or fill)
        run: python3 scripts/check_dark_colours.py
      - name: No text that vanishes on a fixed-white background at night
        run: python3 scripts/check_dark_pairs.py
      - name: Every PDF draw goes through PdfRtl (right-to-left languages)
        run: python3 scripts/check_pdf_rtl.py
      - name: Icons face the right way in every language
        run: python3 scripts/check_icon_direction.py
      - name: The launcher icon and the splash fit the shapes phones cut them to
        run: |
          pip install --quiet pillow
          python3 scripts/check_icon_fit.py
      - name: The computer's invoice designs are the phone's (generated copies up to date)
        run: python3 scripts/gen_desktop_invoice.py --check
      - name: The computer's business cards are the phone's (generated copies up to date)
        run: python3 scripts/gen_desktop_cards.py --check
      - name: The computer's posters are the phone's (generated copies up to date)
        run: python3 scripts/gen_desktop_poster.py --check
      - name: The computer's stock register is the phone's (generated copy up to date)
        run: python3 scripts/gen_desktop_inspector.py --check
      # The sense the app ships is learnt from this bank; HudhudModelTest (the build's tests) holds the asset to it.
      - name: Hudhud's sentence bank is current (shared/hudhud -> the tests' bank and held-out set)
        run: python3 scripts/gen_hudhud_bank.py --check
      # The owner's rule: Hudhud brings the answer and the owner's own tap saves. No file of his may call a DAO write,
      # run raw SQL, send a message or open a network call (scripts/check_hudhud_readonly.py).
      - name: Hudhud only reads (no write, no send, no network call in any of his files)
        run: python3 scripts/check_hudhud_readonly.py
      # Plan v1's hard-zero gate "a network call during a text answer = 0" (Marhala 3): the engine the shared harness compiles
      # (data/Hudhud*.kt and scripts/shared_harness/deps.txt) imports no network package, uses no network type or call and
      # names nothing of the shared module's network files (LiveCloud, WifiSync…). The allow-list is empty.
      - name: Hudhud's engine answers a typed question offline (no network package, type, call or network file in its closure)
        run: python3 scripts/check_hudhud_offline.py
      # Plan v1, Marhala 12 (governance): every data file Hudhud is trained, tuned or tested on is a row of
      # docs/hudhud-data-manifest.tsv with its role, languages, rows, SHA-256, origin, synthetic and native-read status (D17);
      # a file that moved without its row, or a new one with no row, fails. Every source the manifest names is in
      # docs/hudhud-rights-register.tsv, and docs/decision-log.md lists every D-decision of docs/decisions-*.md. Names only (lesson 125).
      - name: Hudhud's data manifest, rights register and decision log are current
        run: python3 scripts/hudhud_manifest.py --check
      # Plan v1, Marhala 11 item 5: docs/hudhud-glossary.tsv is HudhudMind.kt's LEXICON by concept and language (the language
      # read from the letters, never guessed), with a reviewed_by column a native reader fills; stale against the code = fail.
      - name: Hudhud's glossary is current against HudhudMind.kt
        run: python3 scripts/hudhud_glossary.py --check
      # Marhala 2: the check log's triage masks every name and number and never writes inside the repository (test_hudhud_checklog.py);
      # the speed test's sample is the held-out file's every fourth row, never stale (hudhud_speed_sample.py --check).
      - name: Hudhud's field-test tools (check-log triage tests, the speed sample current)
        run: python3 scripts/test_hudhud_checklog.py && python3 scripts/hudhud_speed_sample.py --check
      # The owner's rule: Hudhud's reach is the app's own map, not a list somebody remembered. A new table, column, screen, Home tile
      # or More entry fails here until shared/hudhud/catalog/decisions.tsv says what Hudhud does with it, and every claim that he
      # tells something is held to the code that tells it and to the gate its own screen asks (scripts/gen_hudhud_catalog.py).
      - name: Hudhud's catalog is complete and current (every column, screen, tile and More entry decided)
        run: python3 scripts/gen_hudhud_catalog.py --check
      # A column the backup never names is lost by a restore; a private column written without `secrets` reaches a helper's
      # phone or an heir (8 Nov m42, 15 Nov: a sale line's cost). Names only, not a run (lesson 125).
      - name: Every column is backed up and the owner's private columns stay out of a helper's copy
        run: python3 scripts/check_book_columns.py
      # The owner's rule (16 Nov 2026): every bug class found is kept with its guard and the test that holds it, so the same kind
      # of mistake is caught next time. Names only, not a run (lesson 125); a class with NONE is the honest backlog, printed here.
      - name: The bug-class register names guards and tests that exist
        run: python3 scripts/check_bug_classes.py
      # Lesson 80 (BC-077): five customers' numbers from the owner's photo once reached a public comment. Every Pakistani
      # mobile number in a tracked file is the invented family or listed as made up after a person read it.
      - name: No real phone number in the repository (only the invented family or listed made-up numbers)
        run: python3 scripts/check_invented_numbers.py
      # Lesson 143 (BC-078): Room's grammar refuses an alias that is an SQL keyword (AS first), which SQLite takes.
      - name: No Room query alias is an SQL keyword
        run: python3 scripts/check_room_aliases.py
      # T27: the sets Hudhud is learnt and measured on. Fails on a train sentence that is also a measured one (leakage; the
      # overlap already there is listed and may only shrink), a real-looking phone number, a label no reading can be, an
      # empty sentence, a language not among the nine and columns out of place (scripts/hudhud_sets.py).
      - name: Hudhud's sentence sets pass the quality gate (no leakage, no real number, every label a reading)
        run: python3 scripts/hudhud_sets.py --check
      # BC-105: a word key the shared code names must be a resource, or the phone's WordIds fails to compile on CI.
      - name: Every word key the shared code names is a resource
        run: python3 scripts/check_word_keys.py
      # BC-194, BC-223: every DAO write has a gate or an audit row on its path, except the writes frozen in WAITING for the
      # owner's decision; a new ungated write, a new bare path or a gate taken off a scheme's edit, claim or delete fails.
      - name: No DAO write loses its gate (the ratchet)
        run: python3 scripts/check_dao_gates.py --ratchet
      # BC-192, BC-195, BC-225: a release is published from a job without the signing/Firebase secrets, no file git ignores
      # is still tracked, and every CSV import reads its text through CsvImport.decode (Excel's encodings).
      - name: Release jobs hold no secrets, nothing ignored is tracked, CSV reads are decoded
        run: python3 scripts/check_repo_guards.py
      # BC-243 (24 Nov 2026, plan B5): no runBlocking or Thread.sleep in app/src/main outside an allow-list of waits known
      # to run off the main thread (Play Console's ANR is 5 s of unanswered input).
      - name: No blocking wait on a path the main thread can reach
        run: python3 scripts/check_main_thread.py
      # The 24 Nov 2026 master plan (section 10): one line per item, five statuses only, no VERIFIED COMPLETE or PARTIAL
      # without evidence that exists, the duplicate register as its own column. Names only, not a run (lesson 125).
      - name: The work status register is honest (every plan item, allowed statuses, evidence for a done)
        run: python3 scripts/check_work_status.py
      # BC-250 (24 Nov 2026): every SharedPreferences file the phone opens is per shop by its name, in BusinessKeys.SHARED_FILES,
      # cleared by its owner, or on the device-wide list with a reason. Names only, not a run (lesson 125).
      - name: Every preference file says whether it belongs to a shop
        run: python3 scripts/check_pref_names.py
      # Plan B8 (24 Nov 2026): every screen, Home tile, More entry and printed document is a row of docs/capability-matrix.tsv with
      # its gate, trade limit and proof; a row with no proof says NONE and is counted (a ratchet). Names only, not a run (lesson 125).
      - name: Every screen and document is in the capability matrix, with its proof
        run: python3 scripts/check_capability_matrix.py
      # Plan B3 (24 Nov 2026): every host, SDK and intent that sends anything off the device is a row of docs/data-flows.tsv, and the
      # privacy-policy sections it names exist; a flow the policy does not name is written down as a gap. Names only (lesson 125).
      - name: Every place the app sends data is written down and named in the privacy policy
        run: python3 scripts/check_data_flows.py
      # Plan H3 (24 Nov 2026): every figure in the formula book names a function that exists.
      - name: Every figure in the formula book names a function that exists
        run: python3 scripts/check_formula_book.py
      # Plan B4 (25 Nov 2026): the pairwise array of language, trade, platform, text size and theme is current.
      - name: The language and trade covering array is current
        run: python3 scripts/gen_covering_array.py --check
      # The local Gradle-free harness (lesson 93) finds its files by list: a file moved or renamed fails here, not at the next run.
      - name: The shared harness's file lists are current
        run: bash scripts/shared_harness/run.sh --lists-only
