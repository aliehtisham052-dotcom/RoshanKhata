# The two string failures the Android build never catches:
# a key missing from a locale (silent English fallback) and a
# placeholder mismatch (runtime crash, only in that language).
# scripts/check_strings.py explains both; this just runs it on
# every push and pull request. Seconds, no dependencies.
name: Strings

on:
  push:
    paths:
      - 'app/src/main/res/values*/strings.xml'
      - 'app/src/main/res/values*/arrays.xml'
      - 'scripts/check_strings.py'
      - '.github/workflows/strings.yml'
      # Dark-mode colour guard: any layout, drawable, colour or theme change.
      - 'app/src/main/res/layout/**'
      - 'app/src/main/res/drawable*/**'
      - 'app/src/main/res/color/**'
      - 'app/src/main/res/values*/colors.xml'
      - 'app/src/main/res/values/themes.xml'
      - 'scripts/check_dark_colours.py'
      - 'scripts/check_dark_pairs.py'
      - 'scripts/check_pdf_rtl.py'
      - 'scripts/check_icon_direction.py'
      - 'app/src/main/java/**'
      # The computer's copies of the phone's designs (gen_desktop_*.py --check).
      - 'scripts/gen_desktop_*.py'
      - 'desktop/src/main/kotlin/**'
  pull_request:
    paths:
      - 'app/src/main/res/values*/strings.xml'
      - 'app/src/main/res/values*/arrays.xml'
      - 'scripts/check_strings.py'
      - '.github/workflows/strings.yml'
      # Dark-mode colour guard: any layout, drawable, colour or theme change.
      - 'app/src/main/res/layout/**'
      - 'app/src/main/res/drawable*/**'
      - 'app/src/main/res/color/**'
      - 'app/src/main/res/values*/colors.xml'
      - 'app/src/main/res/values/themes.xml'
      - 'scripts/check_dark_colours.py'
      - 'scripts/check_dark_pairs.py'
      - 'scripts/check_pdf_rtl.py'
      - 'scripts/check_icon_direction.py'
      - 'app/src/main/java/**'
      # The computer's copies of the phone's designs (gen_desktop_*.py --check).
      - 'scripts/gen_desktop_*.py'
      - 'desktop/src/main/kotlin/**'

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: String parity across 9 locales
        run: python3 scripts/check_strings.py
      - name: Dark-mode colours keep one job (text or fill)
        run: python3 scripts/check_dark_colours.py
      - name: No text that vanishes on a fixed-white background at night
        run: python3 scripts/check_dark_pairs.py
      - name: Every PDF draw goes through PdfRtl (right-to-left languages)
        run: python3 scripts/check_pdf_rtl.py
      - name: Icons face the right way in every language
        run: python3 scripts/check_icon_direction.py
      - name: The computer's invoice designs are the phone's (generated copies up to date)
        run: python3 scripts/gen_desktop_invoice.py --check
      - name: The computer's business cards are the phone's (generated copies up to date)
        run: python3 scripts/gen_desktop_cards.py --check
      - name: The computer's posters are the phone's (generated copies up to date)
        run: python3 scripts/gen_desktop_poster.py --check
