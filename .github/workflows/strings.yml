# The two string failures the Android build never catches:
# a key missing from a locale (silent English fallback) and a
# placeholder mismatch (runtime crash, only in that language).
# scripts/check_strings.py explains both; this just runs it on
# every push and pull request. Seconds, no dependencies.
name: Strings

on:
  push:
    paths:
      - 'app/src/main/res/values*/strings.xml'
      - 'app/src/main/res/values*/arrays.xml'
      - 'scripts/check_strings.py'
      - '.github/workflows/strings.yml'
      # Dark-mode colour guard: any layout, drawable, colour or theme change.
      - 'app/src/main/res/layout/**'
      - 'app/src/main/res/drawable*/**'
      - 'app/src/main/res/color/**'
      - 'app/src/main/res/values*/colors.xml'
      - 'app/src/main/res/values/themes.xml'
      - 'scripts/check_dark_colours.py'
      - 'scripts/check_dark_pairs.py'
      - 'scripts/check_pdf_rtl.py'
      - 'scripts/check_icon_direction.py'
      - 'scripts/check_icon_fit.py'
      - 'app/src/main/res/mipmap-*/**'
      - 'app/src/main/res/drawable-nodpi/splash_logo.webp'
      - 'app/src/main/java/**'
      # check_pdf_rtl.py scans shared/src too (R103, 23 Oct 2026).
      - 'shared/src/**'
      # The computer's copies of the phone's designs (gen_desktop_*.py --check).
      - 'scripts/gen_desktop_*.py'
      - 'desktop/src/main/kotlin/**'
      # Hudhud's sentence bank, written into the tests' resources (gen_hudhud_bank.py --check).
      - 'shared/hudhud/**'
      - 'scripts/gen_hudhud_bank.py'
      # Hudhud only reads (check_hudhud_readonly.py).
      - 'scripts/check_hudhud_readonly.py'
      - 'scripts/gen_viewer_dao.py'
      # Hudhud's catalog: every stored column, screen, tile and More entry has a decision (gen_hudhud_catalog.py --check).
      - 'scripts/gen_hudhud_catalog.py'
  pull_request:
    paths:
      - 'app/src/main/res/values*/strings.xml'
      - 'app/src/main/res/values*/arrays.xml'
      - 'scripts/check_strings.py'
      - '.github/workflows/strings.yml'
      # Dark-mode colour guard: any layout, drawable, colour or theme change.
      - 'app/src/main/res/layout/**'
      - 'app/src/main/res/drawable*/**'
      - 'app/src/main/res/color/**'
      - 'app/src/main/res/values*/colors.xml'
      - 'app/src/main/res/values/themes.xml'
      - 'scripts/check_dark_colours.py'
      - 'scripts/check_dark_pairs.py'
      - 'scripts/check_pdf_rtl.py'
      - 'scripts/check_icon_direction.py'
      - 'app/src/main/java/**'
      # check_pdf_rtl.py scans shared/src too (R103, 23 Oct 2026).
      - 'shared/src/**'
      # The computer's copies of the phone's designs (gen_desktop_*.py --check).
      - 'scripts/gen_desktop_*.py'
      - 'desktop/src/main/kotlin/**'
      # Hudhud's sentence bank, written into the tests' resources (gen_hudhud_bank.py --check).
      - 'shared/hudhud/**'
      - 'scripts/gen_hudhud_bank.py'
      # Hudhud only reads (check_hudhud_readonly.py).
      - 'scripts/check_hudhud_readonly.py'
      - 'scripts/gen_viewer_dao.py'
      # Hudhud's catalog: every stored column, screen, tile and More entry has a decision (gen_hudhud_catalog.py --check).
      - 'scripts/gen_hudhud_catalog.py'

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: String parity across 9 locales
        run: python3 scripts/check_strings.py
      - name: Dark-mode colours keep one job (text or fill)
        run: python3 scripts/check_dark_colours.py
      - name: No text that vanishes on a fixed-white background at night
        run: python3 scripts/check_dark_pairs.py
      - name: Every PDF draw goes through PdfRtl (right-to-left languages)
        run: python3 scripts/check_pdf_rtl.py
      - name: Icons face the right way in every language
        run: python3 scripts/check_icon_direction.py
      - name: The launcher icon and the splash fit the shapes phones cut them to
        run: |
          pip install --quiet pillow
          python3 scripts/check_icon_fit.py
      - name: The computer's invoice designs are the phone's (generated copies up to date)
        run: python3 scripts/gen_desktop_invoice.py --check
      - name: The computer's business cards are the phone's (generated copies up to date)
        run: python3 scripts/gen_desktop_cards.py --check
      - name: The computer's posters are the phone's (generated copies up to date)
        run: python3 scripts/gen_desktop_poster.py --check
      - name: The computer's stock register is the phone's (generated copy up to date)
        run: python3 scripts/gen_desktop_inspector.py --check
      # The sense the app ships is learnt from this bank; HudhudModelTest (the build's tests) holds the asset to it.
      - name: Hudhud's sentence bank is current (shared/hudhud -> the tests' bank and held-out set)
        run: python3 scripts/gen_hudhud_bank.py --check
      # The owner's rule: Hudhud brings the answer and the owner's own tap saves. No file of his may call a DAO write,
      # run raw SQL, send a message or open a network call (scripts/check_hudhud_readonly.py).
      - name: Hudhud only reads (no write, no send, no network call in any of his files)
        run: python3 scripts/check_hudhud_readonly.py
      # The owner's rule: Hudhud's reach is the app's own map, not a list somebody remembered. A new table, column, screen, Home tile
      # or More entry fails here until shared/hudhud/catalog/decisions.tsv says what Hudhud does with it, and every claim that he
      # tells something is held to the code that tells it and to the gate its own screen asks (scripts/gen_hudhud_catalog.py).
      - name: Hudhud's catalog is complete and current (every column, screen, tile and More entry decided)
        run: python3 scripts/gen_hudhud_catalog.py --check
