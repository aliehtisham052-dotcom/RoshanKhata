name: Poster proof

# Run by hand (workflow_dispatch): draws every poster design on an emulator,
# in English and Urdu, with its 3D hero (Poster3dOnDeviceTest) and flat
# (PosterOnDeviceTest), prints the device log as annotations, and puts the
# pictures on the "poster-proof" pre-release so they can be looked at.
# Dummy shop data only ("Ali Traders", 0300 0000000). The full on-device
# suite (instrumented.yml) is unchanged.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          # Cached (25 Nov 2026, BC-290): Maven Central answers 429 to runners that download everything
          # on every run. Written by main and kmp-* pushes only; pull requests read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/kmp-') }}
          gradle-version: 8.14.3
      # As instrumented.yml compiles the on-device tests (the emulator step builds the debug APK itself), with the
      # compiler's own words as annotations: the run of 19 Nov 2026 failed here and said nothing but "exit code 1".
      - name: Compile
        run: |
          set +e
          gradle assembleDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee /tmp/compile_output.txt
          exit ${PIPESTATUS[0]}
      - name: Publish compile errors
        if: failure()
        run: |
          if [ ! -f /tmp/compile_output.txt ]; then exit 0; fi
          errs=$(grep -iE "^e: |error:|Unresolved reference|Could not (find|resolve)" /tmp/compile_output.txt | head -40 | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$errs" ] && echo "::error title=Compiler errors::$errs"
          why=$(grep -A12 "What went wrong" /tmp/compile_output.txt | grep -v "^--$" | head -14 | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$why" ] && echo "::error title=What went wrong::$why"
          true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Draw the posters with the device log
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # ANGLE, as instrumented.yml (note 5 there): the old translator cannot run Filament.
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: sh scripts/poster3d-probe.sh
      - name: Put the pictures on the poster-proof pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls /tmp/rtl-proof/* >/dev/null 2>&1 || { echo "no pictures"; exit 0; }
          gh release view poster-proof >/dev/null 2>&1 || gh release create poster-proof --prerelease \
            --title "Poster proof (CI pictures)" --notes "Pictures drawn by the Poster proof workflow on an emulator, dummy data only."
          gh release upload poster-proof /tmp/rtl-proof/*.png /tmp/rtl-proof/*.mp4 --clobber 2>/dev/null || gh release upload poster-proof /tmp/rtl-proof/*.png --clobber
