name: Poster proof

# Run by hand (workflow_dispatch): draws every poster design on an emulator,
# in English and Urdu, with its 3D hero (Poster3dOnDeviceTest) and flat
# (PosterOnDeviceTest), prints the device log as annotations, and puts the
# pictures on the "poster-proof" pre-release so they can be looked at.
# Dummy shop data only ("Ali Traders", 0300 0000000). The full on-device
# suite (instrumented.yml) is unchanged.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
          gradle-version: 8.14.3
      - name: Compile
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Draw the posters with the device log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # ANGLE, as instrumented.yml (note 5 there): the old translator cannot run Filament.
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: sh scripts/poster3d-probe.sh
      - name: Put the pictures on the poster-proof pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls /tmp/rtl-proof/*.png >/dev/null 2>&1 || { echo "no pictures"; exit 0; }
          gh release view poster-proof >/dev/null 2>&1 || gh release create poster-proof --prerelease \
            --title "Poster proof (CI pictures)" --notes "Pictures drawn by the Poster proof workflow on an emulator, dummy data only."
          gh release upload poster-proof /tmp/rtl-proof/*.png --clobber
