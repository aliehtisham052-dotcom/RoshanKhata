name: Poster 3D probe

# Run by hand (workflow_dispatch) when the 3D poster needs looking at on an
# emulator: only Poster3dOnDeviceTest, ten minutes at most, with the device
# log printed whether the test passes, fails or hangs. The full on-device
# suite (instrumented.yml) is unchanged.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One emulator per look: a GPU fault kills the whole emulator, so each
    # part of the frame is tried on its own.
    strategy:
      fail-fast: false
      matrix:
        look: [empty, model, translucent, ibl, sun, shadows, msaa, fxaa, emulator, full]
    env:
      LOOK: ${{ matrix.look }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
          gradle-version: 8.14.3
      - name: Compile
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the 3D test with the device log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: sh scripts/poster3d-probe.sh
      - name: Upload pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poster3d-probe-${{ matrix.look }}
          path: /tmp/rtl-proof/
          if-no-files-found: ignore
