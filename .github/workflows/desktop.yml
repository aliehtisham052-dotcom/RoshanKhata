name: Windows app

# Roshan Khata for Windows (KMP Phase 6). GitHub's Windows runner builds the
# MSI (Compose Desktop packages only on the system it targets, and fetches
# its own WiX). The MSI goes on the "desktop-test" pre-release for the owner
# to install on a laptop; it is not signed, so Windows SmartScreen will warn
# until it ships through the Microsoft Store, which signs it for free.
on:
  push:
    branches: [ main, 'kmp-*' ]
    paths-ignore:
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msi:
    # Pinned, like the Android build: a runner image change should be chosen, not met.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
          gradle-version: 8.14.3

      - name: Computer-side tests, then the MSI
        shell: bash
        run: |
          set +e
          gradle :shared:desktopTest :desktop:test :desktop:packageMsi --no-daemon --stacktrace 2>&1 | tee /tmp/msi_output.txt
          exit ${PIPESTATUS[0]}

      - name: Publish the cause
        if: failure()
        shell: bash
        run: |
          errs=$(grep -iE "^e: |FAILED|AssertionError|error:" /tmp/msi_output.txt | head -40 | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$errs" ] && echo "::error title=Compiler and test errors::$errs"
          why=$(grep -A14 "What went wrong" /tmp/msi_output.txt | grep -v "^--$" | head -16 | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$why" ] && echo "::error title=What went wrong::$why"
          true

      # The Store's package (MSIX), from the same app folder the MSI installs.
      # Identity values come from Partner Center once the name is reserved
      # (repository variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER,
      # MSIX_PUBLISHER_DISPLAY); until then placeholders, for checking only.
      - name: Pack the MSIX (Microsoft Store)
        if: success()
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'Innovation313.RoshanKhata' }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Innovation313' }}
          PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY || 'Innovation 313' }}
        run: |
          $ErrorActionPreference = 'Continue'
          trap { Write-Output "::error title=MSIX step::$($_.Exception.Message)"; exit 1 }
          $app = Get-ChildItem desktop/build/compose/binaries/main/app -Directory | Select-Object -First 1
          if (-not $app) { Write-Output "::error::No app folder from createDistributable"; exit 1 }
          $stage = "msix-stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$($app.FullName)\*" $stage -Recurse
          Copy-Item desktop/msix/Assets $stage -Recurse
          $m = Get-Content desktop/msix/AppxManifest.xml -Raw
          $m = $m.Replace('@IDENTITY_NAME@', $env:IDENTITY_NAME).Replace('@PUBLISHER@', $env:PUBLISHER)
          $m = $m.Replace('@PUBLISHER_DISPLAY@', $env:PUBLISHER_DISPLAY).Replace('@VERSION@', '1.0.0.0')
          Set-Content "$stage/AppxManifest.xml" $m -Encoding utf8
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { Write-Output "::error::makeappx.exe not found on the runner"; exit 1 }
          # makeappx's own words, as one annotation: the log is not readable from outside.
          $PSNativeCommandUseErrorActionPreference = $false
          $out = & $makeappx.FullName pack /d $stage /p RoshanKhata-Windows-store.msix /o 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            $msg = ($out -split "`n" | Where-Object { $_ -match 'error|Error|0x|manifest|line' } | Select-Object -First 20) -join '%0A'
            Write-Output "::error title=makeappx failed ($LASTEXITCODE)::$msg"
            exit 1
          }
          Write-Output "::notice::MSIX: $((Get-Item RoshanKhata-Windows-store.msix).Length) bytes, identity $env:IDENTITY_NAME"

      - name: Put the MSI on the desktop-test pre-release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msi=$(find desktop/build/compose/binaries -name '*.msi' | head -1)
          echo "::notice::MSI: $msi ($(stat -c %s "$msi") bytes)"
          cp "$msi" RoshanKhata-Windows-test.msi
          gh release view desktop-test >/dev/null 2>&1 || gh release create desktop-test --prerelease \
            --title "Roshan Khata for Windows - test build" --notes "Windows test build. Not signed yet." || true
          gh release upload desktop-test RoshanKhata-Windows-test.msi --clobber
          [ -f RoshanKhata-Windows-store.msix ] && gh release upload desktop-test RoshanKhata-Windows-store.msix --clobber
          # The statement pictures from StatementPrintTest, to look at (lesson 16).
          for f in desktop/build/statement-proof/*.png; do [ -f "$f" ] && gh release upload desktop-test "$f" --clobber; done
          gh release edit desktop-test --notes "Windows test build from ${GITHUB_REF_NAME}, commit ${GITHUB_SHA}. Not signed yet: Windows will warn before installing."
