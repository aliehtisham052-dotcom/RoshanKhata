# The Play Store upload file, on demand.
#
# Play accepts an AAB, not an APK, and only one signed with the release key.
# The four RELEASE_* secrets this uses have existed since last month — the
# normal build already signs with them — so nothing new had to be trusted
# with the keystore; only the bundle step was missing.
#
# Deliberately NOT on every push: an AAB is for a release moment, and every
# upload to Play must carry a fresh versionCode. Run it from the Actions tab
# when there is something to publish.
name: Release AAB

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      same_version:
        description: "Build again with the versionCode of the last bundle (only when that bundle never reached Play)"
        type: boolean
        default: false

jobs:
  aab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # R102 (23 Oct 2026): Play refuses a versionCode it has seen, and the release-aab asset is
      # overwritten by every run, so a repeat run with the same number clobbered the last good
      # bundle with one Play rejects. The number of the last bundle is kept in the release-aab
      # notes ("versionCode: N", written below); the source must be strictly higher. A first run
      # (no number in the notes yet) only says so. same_version = true is the one way past it,
      # for a bundle that was built but never uploaded.
      - name: versionCode is new for Play
        env:
          GH_TOKEN: ${{ github.token }}
          SAME_VERSION: ${{ inputs.same_version }}
        run: |
          code=$(grep -oE '^\s*versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          if [ -z "$code" ]; then echo "::error::versionCode not found in app/build.gradle.kts"; exit 1; fi
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          last=$(gh release view release-aab --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null \
            | grep -oE 'versionCode: [0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "$last" ]; then
            echo "::notice::No versionCode recorded on release-aab yet; building $code (Play itself refuses one it has seen)."
          elif [ "$code" -gt "$last" ]; then
            echo "::notice::versionCode $code (the last bundle was $last)."
          elif [ "$SAME_VERSION" = "true" ] && [ "$code" -eq "$last" ]; then
            echo "::warning::Building versionCode $code again, as asked: upload it only if $code never reached Play."
          else
            echo "::error::versionCode $code is not higher than the last bundle's ($last). Raise versionCode in app/build.gradle.kts (Play refuses a number it has seen); the last bundle on release-aab is left as it is."
            exit 1
          fi

      # R37 (23 Oct 2026): the one build that reaches shopkeepers was the only one packaged with no
      # correctness gate. The string checks (seconds, plain Python) and the same tests as build.yml
      # run before the keystore is even decoded; a red one stops the release.
      - name: Strings and generated copies
        run: |
          python3 scripts/check_strings.py
          python3 scripts/check_dark_colours.py
          python3 scripts/check_dark_pairs.py
          python3 scripts/check_pdf_rtl.py
          python3 scripts/check_icon_direction.py
          python3 scripts/gen_desktop_invoice.py --check
          python3 scripts/gen_desktop_cards.py --check
          python3 scripts/gen_desktop_poster.py --check
          # 30 Oct 2026, the review: strings.yml checked the inspector copy, the release gate did not.
          python3 scripts/gen_desktop_inspector.py --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
          gradle-version: 8.14.3

      # Firebase config for live sync's wake-up (PushWake), from the owner's
      # secret; never committed (public repo). Without it: the app without the wake-up.
      - name: Firebase config (wake-up)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 scripts/google_services.py

      # The keystore exists as a file only for the length of this run, in the
      # runner's own temp directory, and is never written into the workspace.
      - name: Unit tests
        run: |
          set +e
          gradle testDebugUnitTest :shared:desktopTest :desktop:test --no-daemon --stacktrace 2>&1 | tee /tmp/test_output.txt
          EXIT=${PIPESTATUS[0]}
          exit $EXIT

      - name: Publish test failures
        if: failure()
        run: |
          if [ ! -f /tmp/test_output.txt ]; then exit 0; fi
          errs=$(grep -iE "^e: |FAILED|AssertionError" /tmp/test_output.txt | head -40 | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$errs" ] && echo "::error title=Compiler and test errors::$errs"
          why=$(grep -A12 "What went wrong" /tmp/test_output.txt | grep -v "^--$" | head -14 | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$why" ] && echo "::error title=What went wrong::$why"
          true

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set — the AAB would be unsigned and Play would reject it."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/roshankhata-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/roshankhata-release.jks" >> $GITHUB_ENV

      - name: Build signed AAB
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +e
          gradle bundleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/aab_output.txt
          EXIT=${PIPESTATUS[0]}
          exit $EXIT

      # Without this the failure reaches us as a bare "exit code 1": the log
      # blob API returns nothing for this runner, and annotations are the only
      # channel that actually gets back. build.yml learned this months ago;
      # this workflow had to learn it once too.
      - name: Publish build failure
        if: failure()
        run: |
          if [ ! -f /tmp/aab_output.txt ]; then exit 0; fi
          echo "## AAB build failure" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -iE "FAILURE:|What went wrong|Execution failed|Caused by|^e: |error:" /tmp/aab_output.txt \
            | head -40 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -iE "FAILURE:|What went wrong|Execution failed|Caused by|^e: |error:" /tmp/aab_output.txt \
            | head -25 \
            | while IFS= read -r line; do
                clean=$(echo "$line" | tr -d '\r' | sed 's/%/%%/g')
                echo "::error::$clean"
              done

      # Proof rather than hope: an unsigned bundle looks exactly like a signed
      # one until Play rejects it, so the signature is checked here, where the
      # failure is cheap.
      - name: Verify it is actually signed
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          if [ -z "$AAB" ]; then echo "::error::No .aab produced"; exit 1; fi
          if ! unzip -l "$AAB" | grep -qi "META-INF/.*\.RSA\|META-INF/.*\.EC"; then
            echo "::error::The bundle carries no signature block"
            exit 1
          fi
          echo "signed AAB: $AAB"
          echo "## Signed AAB ready" >> $GITHUB_STEP_SUMMARY
          echo "Download it from the Artifacts section of this run." >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v6
        with:
          name: RoshanKhata-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14

      # THE AAB AS A PLAIN FILE, not a ZIP (14 Oct).
      #
      # An Actions artifact always arrives as a .zip served from Azure blob
      # storage. On the owner's phone that download came out unopenable in
      # both the browser's handler and Files by Google, and Play refuses a
      # .zip ("Upload a valid app bundle"). A release asset is the file
      # itself, from github.com, the same route the test APK already takes.
      #
      # Its own tag, never "latest" (the debug APK) and never "release-test"
      # (the minified APK). The file holds the signature block only: the
      # keystore stays in the secrets and was never in the workspace.
      - name: Copy the bundle under a plain name
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          if [ -z "$AAB" ]; then echo "::error::No .aab to publish"; exit 1; fi
          mkdir -p out-aab
          cp "$AAB" out-aab/RoshanKhata-release.aab

      - name: Publish the bundle as a downloadable file
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-aab
          name: "Roshan Khata — signed AAB for Play upload"
          body: |
            The signed Android App Bundle for the Play Console, as a plain
            file (not a ZIP). Upload it as it is.

            **Commit:** ${{ github.sha }}

            versionCode: ${{ env.VERSION_CODE }}
          files: out-aab/RoshanKhata-release.aab
          make_latest: false
          prerelease: true

      # THE MINIFIED APK, and why this step had to exist.
      #
      # R8 runs on the RELEASE variant only. The rolling APK everyone installs
      # comes from build.yml, which runs assembleDebug — so with minification
      # now on, the build being tested on a real phone was the only build R8
      # never touched, and the one shipped to Play was the only one nobody
      # could install. An AAB cannot be sideloaded to check that.
      #
      # R8's failures are runtime failures: Drive sign-in, backup, restore and
      # PDF all keep compiling perfectly while doing nothing. So the same
      # minified code that goes to Play is also emitted as an installable APK,
      # to be proven on a device BEFORE the bundle is uploaded.
      - name: Build the same minified code as an installable APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v6
        with:
          name: RoshanKhata-release-apk-minified
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # Without the mapping file every future crash report is a list of a(),
      # b(), c(). It is generated per build and cannot be recreated later, so
      # it is kept beside the bundle it belongs to.
      - uses: actions/upload-artifact@v6
        with:
          name: RoshanKhata-r8-mapping
          path: app/build/outputs/mapping/release/
          retention-days: 90

      # A DOWNLOAD LINK, not just an Actions artifact.
      #
      # Actions artifacts serve from Azure blob storage, which is unreachable
      # from inside a locked-down network — this file needs to reach a
      # phone, not stay inside CI. build.yml already solved exactly this for
      # the debug build with a rolling "latest" release; this is the same
      # mechanism under its OWN tag, deliberately not "latest" — that name
      # already means "today's debug build" everywhere it is documented, and
      # this is the release-minified build meant for one thing: proving R8
      # on a real device BEFORE an AAB goes to Play. Overwriting "latest"
      # here would point that link at the wrong build type.
      - name: Rename minified APK for the test release
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/RoshanKhata-release-test.apk

      - name: Publish minified build for device testing
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-test
          name: "Roshan Khata — Minified Release Build (device test)"
          body: |
            The RELEASE build, R8-minified — the same code this run also
            uploaded to Play as a signed AAB. This APK exists so it can be
            installed and walked through on a real phone BEFORE that AAB is
            trusted: R8's failures are runtime failures, not build failures,
            so a green build proves nothing about backup, restore, Drive
            sign-in, or PDF generation on their own.

            **Commit:** ${{ github.sha }}

            Test in this order: Google sign-in → Drive backup → Drive
            restore → PDF (invoice and stock register) → app lock → QR scan
            → close and reopen the app. If anything behaves differently
            from the regular debug build, stop and report it — do not treat
            this build as safe to keep using either way.
          files: out/RoshanKhata-release-test.apk
          make_latest: false
