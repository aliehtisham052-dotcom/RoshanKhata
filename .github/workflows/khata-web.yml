name: Customer page

# web/khata, the customer's own page (balance and the last three entries, sealed on the phone).
# Checked on every push that touches it, on PHP's own server; deployed by hand to the owner's
# hosting, never from here.
on:
  push:
    paths: ["web/khata/**", "scripts/test_khata_web.sh", ".github/workflows/khata-web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - run: php --version
      - run: bash scripts/test_khata_web.sh
