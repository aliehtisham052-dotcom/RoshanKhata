# Play Store screenshots (10 Oct): the real screens on a seeded DEMO book,
# captured on the emulator in English and Urdu, then framed with a caption
# (scripts/frame_screenshots.py). By hand only - Actions -> Store screenshots
# -> Run workflow - and the result is an artifact to download, never a commit.
name: Store screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
          gradle-version: 8.14.3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          script: sh scripts/store-shots.sh
      - name: Frame with captions
        run: |
          pip install --quiet pillow
          python3 scripts/frame_screenshots.py /tmp/store-shots /tmp/store-framed
          ls -R /tmp/store-framed
      # A release asset, not only an Actions artifact: artifacts serve from
      # Azure blob storage, which a locked-down network cannot reach (the
      # same reason build.yml publishes the APK as a release). The rolling
      # "store-screenshots" release always holds the newest set.
      - name: Zip
        run: |
          cd /tmp && zip -qr store-screenshots.zip store-shots store-framed && ls -lh store-screenshots.zip
      - name: Publish to Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: store-screenshots
          name: "Roshan Khata — Store screenshots"
          body: |
            Play Store screenshots on a demo book, English and Urdu, raw and
            framed with captions. Built by the Store screenshots workflow from
            ${{ github.sha }}. Not an app build.
          files: /tmp/store-screenshots.zip
          make_latest: false
      - uses: actions/upload-artifact@v6
        with:
          name: store-screenshots
          path: |
            /tmp/store-shots
            /tmp/store-framed
          retention-days: 30
      - name: Publish the failure
        if: failure()
        run: |
          [ -f /tmp/store_shots_output.txt ] || { echo "::error::The emulator did not start."; exit 0; }
          grep -iE "AssertionError|FAILED|Exception|error:" /tmp/store_shots_output.txt | head -20 \
            | while IFS= read -r line; do echo "::error::$(echo "$line" | tr -d '\r' | sed 's/%/%%/g')"; done
