name: TSA check

# The book seal's three time-stamp services asked for real, once each (L014, 16 Nov 2026) — by hand only, never on a
# push: a time service that is down must not fail a build. Only a random 32-byte digest is sent to each.
#
# What it shows, in the run's summary:
#  - each service's answer as the app reads it (Rfc3161.stamp, the app's own road and User-Agent);
#  - every certificate its token carries, with the SHA-256 of its DER;
#  - whether Rfc3161.chain builds the signer's certificate to a root (this JDK's trust store, and FreeTSA's CA
#    certificate fetched from FreeTSA's own page);
#  - OpenSSL's own `ts -verify` of each token against the runner's CA bundle plus that file.
# A root goes into BookSeals.ROOT_PINS only when its fingerprint here agrees with two official sources.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stamp:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-disabled: true
          gradle-version: 8.14.3

      - name: FreeTSA's CA certificate, from FreeTSA's own page
        run: |
          mkdir -p build/tsa-roots
          curl -fsS --max-time 30 https://freetsa.org/files/cacert.pem -o build/tsa-roots/freetsa-cacert.pem || echo "FreeTSA's CA file could not be fetched"
          if [ -s build/tsa-roots/freetsa-cacert.pem ]; then
            {
              echo "## FreeTSA's CA file"
              echo
              echo "- file SHA-256 (as FreeTSA's page prints it): \`$(sha256sum build/tsa-roots/freetsa-cacert.pem | cut -d' ' -f1)\`"
              echo "- $(openssl x509 -in build/tsa-roots/freetsa-cacert.pem -noout -subject)"
              echo "- certificate $(openssl x509 -in build/tsa-roots/freetsa-cacert.pem -noout -fingerprint -sha256)"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stamp once against each service (the app's own code)
        env:
          RK_TSA_LIVE: "1"
          RK_TSA_ROOTS: ${{ github.workspace }}/build/tsa-roots
          RK_TSA_OUT: ${{ github.workspace }}/build/tsa-check
        run: |
          gradle :shared:desktopTest --tests '*TsaLiveCheckTest' --no-daemon --stacktrace
          cat build/tsa-check/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: OpenSSL's own reading of each token
        if: always()
        run: |
          cd build/tsa-check 2>/dev/null || { echo "no tokens"; exit 0; }
          cat /etc/ssl/certs/ca-certificates.crt ../tsa-roots/*.pem > bundle.pem 2>/dev/null || cp /etc/ssl/certs/ca-certificates.crt bundle.pem
          {
            echo "## OpenSSL ts -verify"
            echo
            for t in *.token.der; do
              [ -f "$t" ] || continue
              if openssl ts -verify -digest "$(cat digest.hex)" -token_in -in "$t" -CAfile bundle.pem > "$t.verify.txt" 2>&1; then
                echo "- ${t%.token.der}: verified against the runner's CA bundle (+ FreeTSA's file)"
              else
                echo "- ${t%.token.der}: NOT verified — $(tail -n 2 "$t.verify.txt" | tr '\n' ' ')"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
