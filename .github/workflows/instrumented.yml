name: On-device tests

# Deliberately its OWN workflow, not a job added to build.yml.
#
# build.yml builds the APK the owner installs and publishes it to Releases;
# aab.yml builds the bundle for Play. An emulator takes ten to fifteen minutes
# and can fail for reasons that have nothing to do with this app — a cold AVD,
# a runner without KVM, a flaky boot. Sitting in either of those workflows it
# could hold up or fail a build that is perfectly good. Here it reports on its
# own, beside them, and neither waits for it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push while the emulator is still booting cancels the first: the
# answer for the older commit is no longer the one anybody needs.
concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    # Pinned for the same reason as the other workflows: GitHub moves
    # ubuntu-latest to Ubuntu 26.04 between 19 Oct and 19 Nov 2026, and the
    # Android SDK comes from the runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
          # The SAME pin build.yml and aab.yml use, and the reason this
          # workflow failed four times: without it setup-gradle takes the
          # newest Gradle, which is now 9.7.1, and 9.x removed an internal API
          # the Android Gradle Plugin still calls — the build dies while
          # applying the plugin, before a single line of this project is read.
          # Whatever Gradle this app is built with, its tests are built with.
          gradle-version: 8.14.3

      # The emulator needs hardware acceleration to be usable at all. Without
      # this the AVD falls back to software and times out rather than failing
      # with anything that reads like a cause.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Before any emulator: do these tests even COMPILE? Three runs failed
      # inside the emulator step with nothing readable, and "my test is wrong"
      # and "the emulator did not start" look identical from outside. This
      # takes a minute, needs no device, and tells the two apart.
      - name: Compile the on-device tests
        run: |
          set +e
          gradle assembleDebugAndroidTest --no-daemon --stacktrace 2>&1 \
            | tee /tmp/compile_output.txt
          exit ${PIPESTATUS[0]}

      - name: Publish compile errors
        if: failure()
        run: |
          if [ ! -f /tmp/compile_output.txt ]; then exit 0; fi
          grep -iE "^e: |error:|FAILURE:|Caused by|Unresolved reference|Could not (find|resolve)" \
            /tmp/compile_output.txt | head -25 \
            | while IFS= read -r line; do
                clean=$(echo "$line" | tr -d '\r' | sed 's/%/%%/g')
                echo "::error::$clean"
              done

      - name: Run the on-device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 30 rather than the newest: these tests exercise Room, org.json
          # and Activity startup, none of which differ on a later release, and
          # an older image boots faster and more reliably on CI. minSdk here
          # is 24, so this is also nearer the oldest phone that runs the app
          # than the newest.
          api-level: 29
          arch: x86_64
          # No window, no audio, no boot animation: nothing here looks at the
          # screen, and each of those is a way for a headless runner to hang.
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          # `gradle`, not `./gradlew`: this repo has no wrapper checked in —
          # build.yml and aab.yml both call the `gradle` that
          # gradle/actions/setup-gradle puts on PATH, and the first run of this
          # workflow failed with exit 127 (command not found) for exactly that
          # reason. --no-daemon matches the other two.
          # POSIX sh, NOT bash: the action runs this with /usr/bin/sh, where
          # ${PIPESTATUS[0]} does not exist. Writing it here meant the step
          # reported a shell error instead of gradle's exit status, and the
          # reporting step below found nothing to publish. Redirect and read
          # $? instead, which every shell has.
          script: |
            gradle connectedDebugAndroidTest --no-daemon --stacktrace \
              > /tmp/instrumented_output.txt 2>&1
            STATUS=$?
            tail -120 /tmp/instrumented_output.txt
            exit $STATUS

      # A red tick on its own says nothing. build.yml solved this already and
      # its comment says why: annotations come back through the REST API even
      # when the log blobs do not, which is the only channel that actually
      # reaches a later session. Same pattern here.
      - name: Publish the failure
        if: failure()
        run: |
          if [ ! -f /tmp/instrumented_output.txt ]; then
            echo "::error::The emulator step failed before gradle ran — no output was captured."
            exit 0
          fi
          echo "## On-device Test Failure" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -120 /tmp/instrumented_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          grep -iE "^e: |error:|FAILURE:|Caused by|Unresolved reference|Could not (find|resolve)|FAILED|AssertionError|INSTRUMENTATION" \
            /tmp/instrumented_output.txt \
            | head -25 \
            | while IFS= read -r line; do
                clean=$(echo "$line" | tr -d '\r' | sed 's/%/%%/g')
                echo "::error::$clean"
              done

      # The HTML report, when the tests ran far enough to write one.
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
