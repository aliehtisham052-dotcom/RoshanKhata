name: On-device tests (compile)

# What this DOES check: that everything in app/src/androidTest compiles
# against the app. A test that no longer matches the code it tests — a renamed
# DAO method, a changed entity field — fails here, on every push, in about
# three minutes and with no device involved.
#
# What it does NOT yet do: RUN those tests. Six attempts at an emulator on
# GitHub's runners produced six red ticks and no verdict, so that half is
# parked rather than left failing forever and teaching everyone to ignore a
# red tick. The tests themselves are written, compile, and can be run on a
# real phone at any time with:
#
#     gradle connectedDebugAndroidTest
#
# from a machine with a device or emulator attached. Whoever picks the CI side
# back up starts from a known-good state: Gradle must be pinned to 8.14.3 (9.x
# breaks the Android plugin), the emulator action runs its script in POSIX sh,
# and api-level 30 / google_apis / x86_64 / pixel_2 is an AVD that does boot
# here — api-level 29 with the default target has no image and fails in 80
# seconds looking exactly like a broken emulator.
#
# Its own workflow, not a job in build.yml or aab.yml, so it can never hold up
# the APK or the bundle — which is what kept those green through all six.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push while the emulator is still booting cancels the first: the
# answer for the older commit is no longer the one anybody needs.
concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    # Back on 24.04, with the other workflows. 22.04 was tried on the theory
    # that the AVD trouble was the runner; it failed the same way, which ruled
    # the runner out. The very first run of this workflow booted an emulator
    # here perfectly well — its error was a missing gradlew, which only a
    # RUNNING emulator could have reported.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
          # The SAME pin build.yml and aab.yml use, and the reason this
          # workflow failed four times: without it setup-gradle takes the
          # newest Gradle, which is now 9.7.1, and 9.x removed an internal API
          # the Android Gradle Plugin still calls — the build dies while
          # applying the plugin, before a single line of this project is read.
          # Whatever Gradle this app is built with, its tests are built with.
          gradle-version: 8.14.3

      # The emulator needs hardware acceleration to be usable at all. Without
      # this the AVD falls back to software and times out rather than failing
      # with anything that reads like a cause.
      # Does everything in app/src/androidTest still compile against the app?
      - name: Compile the on-device tests
        run: |
          set +e
          gradle assembleDebugAndroidTest --no-daemon --stacktrace 2>&1 \
            | tee /tmp/compile_output.txt
          exit ${PIPESTATUS[0]}

      - name: Publish compile errors
        if: failure()
        run: |
          if [ ! -f /tmp/compile_output.txt ]; then exit 0; fi
          grep -iE "^e: |error:|FAILURE:|Caused by|Unresolved reference|Could not (find|resolve)" \
            /tmp/compile_output.txt | head -25 \
            | while IFS= read -r line; do
                clean=$(echo "$line" | tr -d '\r' | sed 's/%/%%/g')
                echo "::error::$clean"
              done
