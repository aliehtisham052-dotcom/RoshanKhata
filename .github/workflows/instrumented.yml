name: On-device tests

# The tests in app/src/androidTest, run on a real Android emulator, then the
# monkey: thousands of random taps across the whole app, failing on any crash.
# Both are driven by scripts/device-check.sh.
#
# The data side (balance SUM, backup round trip, launcher) already runs on
# every push under Robolectric in build.yml. This covers what a simulated
# Android cannot: rotation, background and back, a real tap on real Android.
#
# Its own workflow, never a job in build.yml or aab.yml: an emulator is slow
# and can fail for reasons unrelated to the app, and nothing here may ever
# hold up the APK or the bundle.
#
# Four things this file had to learn, each from a failed run — keep them:
#   1. Pin Gradle 8.14.3 like build.yml. setup-gradle otherwise takes the
#      newest, and Gradle 9.x breaks the Android plugin while applying it.
#   2. android-emulator-runner splits `script:` on NEWLINES and runs every line
#      as its own `sh -c` (src/script-parser.ts). A command continued with a
#      trailing backslash is therefore cut in two: the first half runs alone,
#      and the stray "\" reaches Gradle as a task name that does not exist —
#      "BUILD FAILED in 8s", every time, looking like a broken emulator. The
#      script below is ONE line on purpose. Do not wrap it.
#   3. That line runs in POSIX sh, not bash: no ${PIPESTATUS}.
#   4. api-level 30 / google_apis / x86_64 / pixel_2 boots here. api-level 29
#      with the default target has no system image, and fails in ~80 seconds.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
          gradle-version: 8.14.3

      # A test that does not compile fails here in a few minutes with a
      # readable error, before any emulator is spent on it.
      - name: Compile the on-device tests
        run: |
          set +e
          gradle assembleDebugAndroidTest --no-daemon --stacktrace 2>&1 \
            | tee /tmp/compile_output.txt
          exit ${PIPESTATUS[0]}

      - name: Publish compile errors
        if: failure()
        run: |
          if [ ! -f /tmp/compile_output.txt ]; then exit 0; fi
          grep -iE "^e: |error:|FAILURE:|Caused by|Unresolved reference|Could not (find|resolve)" \
            /tmp/compile_output.txt | head -25 \
            | while IFS= read -r line; do
                clean=$(echo "$line" | tr -d '\r' | sed 's/%/%%/g')
                echo "::error::$clean"
              done

      # Without hardware acceleration the AVD falls back to software and times
      # out rather than failing with anything that reads like a cause.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the on-device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          # ONE line (see note 2 at the top). The real steps live in
          # scripts/device-check.sh, which runs as one sh process: the written
          # tests, then the monkey crash hunt. Outputs go to /tmp files so the
          # step below can publish the cause.
          script: sh scripts/device-check.sh

      # Annotations come back through the REST API even when log blobs do not
      # (the same reason build.yml does this), so the cause reaches whoever
      # looks next instead of a bare red tick.
      - name: Publish the failure
        if: failure()
        run: |
          if [ ! -f /tmp/instrumented_output.txt ]; then
            echo "::error::The emulator did not start: gradle never ran, so there is no output."
            exit 0
          fi
          echo "## On-device test failure" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -120 /tmp/instrumented_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -iE "^e: |error:|FAILURE:|Caused by|not found in|FAILED|AssertionError|INSTRUMENTATION_|java\.lang\.[A-Za-z]+(Exception|Error)" \
            /tmp/instrumented_output.txt | head -25 \
            | while IFS= read -r line; do
                clean=$(echo "$line" | tr -d '\r' | sed 's/%/%%/g')
                echo "::error::$clean"
              done
          # The monkey's own crash, if that is what failed: the stack trace
          # from the crash buffer names the screen and the line.
          if [ -f /tmp/crash_log.txt ] && grep -q "com.innovation313" /tmp/crash_log.txt; then
            echo "## Monkey found a crash" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -80 /tmp/crash_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "FATAL EXCEPTION|Process:|Exception|Error|at com\.innovation313" /tmp/crash_log.txt | head -20 \
              | while IFS= read -r line; do
                  clean=$(echo "$line" | tr -d '\r' | sed 's/%/%%/g')
                  echo "::error::monkey: $clean"
                done
          fi
          if [ -f /tmp/monkey_output.txt ] && grep -q "// CRASH" /tmp/monkey_output.txt; then
            grep -A12 "// CRASH" /tmp/monkey_output.txt | head -25 \
              | while IFS= read -r line; do
                  clean=$(echo "$line" | tr -d '\r' | sed 's/%/%%/g')
                  echo "::error::monkey: $clean"
                done
          fi

      # The numbers, pass or fail, as annotations: those come back through the
      # REST API even when log blobs and artifacts do not, so "green" can be
      # checked for what it actually covered instead of taken on trust.
      - name: Publish the result
        if: always()
        run: |
          # Reporting only: it must never be the thing that turns a run red.
          # (grep -c exits 1 on a count of zero — zero crashes — which under
          # the default `bash -eo pipefail` used to fail this step.)
          set +e +o pipefail
          # Test counts from the JUnit XML. Device names put spaces and
          # brackets in these file names, so read them line by line.
          tests=0; failed=0; files=0
          find app/build -name 'TEST-*.xml' -path '*androidTest*' 2>/dev/null > /tmp/xmls.txt
          while IFS= read -r f; do
            files=$((files + 1))
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | tr -dc '0-9')
            x=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | tr -dc '0-9')
            tests=$((tests + ${t:-0})); failed=$((failed + ${x:-0}))
          done < /tmp/xmls.txt
          echo "::notice::On-device tests (JUnit XML, $files files): $tests run, $failed failed"
          # Gradle's own line, as a cross-check that does not depend on paths.
          if [ -f /tmp/instrumented_output.txt ]; then
            line=$(grep -E "Finished [0-9]+ tests|Tests on .* [0-9]+|tests completed|BUILD (SUCCESSFUL|FAILED)" /tmp/instrumented_output.txt | tr -d '\r' | tr '\n' ' ' | cut -c1-400)
            echo "::notice::Gradle said: ${line:-nothing matched}"
          fi
          if [ "$files" -eq 0 ]; then
            where=$(find app/build -path '*androidTest*' -name '*.xml' 2>/dev/null | head -5 | tr '\n' ' ')
            echo "::notice::No TEST-*.xml found. androidTest XMLs present: ${where:-none}"
          fi
          if [ -f /tmp/monkey_output.txt ]; then
            injected=$(grep -o 'Events injected: [0-9]*' /tmp/monkey_output.txt | tail -1 | tr -dc '0-9')
            crashes=$(grep -c '// CRASH' /tmp/monkey_output.txt)
            anrs=$(grep -c 'NOT RESPONDING' /tmp/monkey_output.txt)
            echo "::notice::Monkey: ${injected:-0} events injected, ${crashes:-0} crashes, ${anrs:-0} ANR reports"
          else
            echo "::notice::Monkey: did not run"
          fi
          exit 0

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: on-device-test-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            /tmp/instrumented_output.txt
            /tmp/monkey_output.txt
            /tmp/crash_log.txt
          retention-days: 14
          if-no-files-found: ignore
