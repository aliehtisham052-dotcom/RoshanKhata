name: Android CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'ci/**' 
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true
          gradle-version: 8.14.3

      # Decode the stable release keystore from a repository secret. The key
      # itself is never committed — only its base64 form lives in Secrets, and
      # the decoded file exists only for the length of this run. A stable key is
      # what gives Google Sign-In one unchanging SHA-1 and lets the Play Store
      # accept future updates.
      - name: Decode keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/roshankhata-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/roshankhata-release.jks" >> $GITHUB_ENV

      # Correctness before packaging. The build step below only proves the
      # code compiles; these prove VoiceEntry still decides whose page an
      # amount lands on. A green APK containing a matcher that hands the
      # owner a stranger's ledger is not a green build.
      - name: Unit tests
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/test_output.txt
          EXIT=${PIPESTATUS[0]}
          exit $EXIT

      - name: Publish test failures
        if: failure()
        run: |
          if [ -f /tmp/test_output.txt ]; then
            echo "## Unit Test Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -iE "FAILED|expected:|actual:|AssertionError|^e: " /tmp/test_output.txt \
              | head -40 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            # Annotations reach us through the REST API even when log blobs do
            # not, which is the only channel that actually gets back here.
            grep -iE "FAILED|AssertionError|^e: " /tmp/test_output.txt \
              | head -25 \
              | while IFS= read -r line; do
                  clean=$(echo "$line" | tr -d '\r' | sed 's/%/%%/g')
                  echo "::error::$clean"
                done
          fi

      - name: Build Debug APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +e
          # This APK is a private dev build the owner installs alongside (or
          # over) whatever is on Play, on his own phone. Android refuses to
          # install a package over one with an equal or higher versionCode --
          # the source versionCode is fixed for the real Play release, so a
          # sideloaded dev build with that same number can silently fail to
          # install once Play's own versionCode has moved past it. A
          # timestamp is always higher than any manually-incremented Play
          # number, so this build always wins that comparison.
          DEV_VERSION_CODE=$(date +%s)
          echo "Dev build versionCode override: $DEV_VERSION_CODE"
          gradle assembleDebug -PversionCodeOverride=$DEV_VERSION_CODE --no-daemon --stacktrace 2>&1 | tee /tmp/build_output.txt
          EXIT=${PIPESTATUS[0]}
          exit $EXIT

      - name: Publish error (on failure)
        if: failure()
        run: |
          # The tests run before this; if they were what failed, there is no
          # build log to print and their own step has already reported.
          if [ ! -f /tmp/build_output.txt ]; then exit 0; fi
          echo "## Build Failure Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -120 /tmp/build_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Also emit each error line as a workflow annotation. Annotations come
          # back through the REST API even when log blobs do not, which is the
          # only channel that actually reaches us.
          grep -iE "^e: |error:|FAILURE:|Caused by|Unresolved reference|not found" /tmp/build_output.txt \
            | head -25 \
            | while IFS= read -r line; do
                clean=$(echo "$line" | tr -d '\r' | sed 's/%/%%/g')
                echo "::error::$clean"
              done

      - name: Rename APK
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/RoshanKhata-latest.apk
          ls -lh out/

      # A rolling "latest" release: one clean, permanent download link that
      # always points at the newest build. No zip, no login, no digging
      # through Actions artifacts — just tap and install on the phone.
      - name: Publish to Releases
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Roshan Khata — Latest Build"
          body: |
            Latest development build of Roshan Khata.

            **Commit:** ${{ github.sha }}
            **Built:** ${{ github.event.head_commit.timestamp }}

            Tap `RoshanKhata-latest.apk` below to download and install.
            You may need to allow installs from unknown sources.
          files: out/RoshanKhata-latest.apk
          make_latest: true

      # Android 7.0 (minSdk 24) compatibility: flags any API call that would
      # crash on an older phone. Runs after the APK is published and is
      # continue-on-error, so it can never hold back the download link.
      - name: Old-Android API check (lint NewApi)
        if: success()
        continue-on-error: true
        run: |
          gradle lintDebug --no-daemon 2>&1 | tail -5
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("app/build/reports/lint-results-debug.xml")
          if not files:
              print("::warning::lint report not found"); raise SystemExit(0)
          issues = ET.parse(files[0]).getroot().findall("issue")
          print(f"Old-Android API findings: {len(issues)}")
          for i in issues:
              loc = i.find("location")
              f = loc.get("file", "").split("/app/", 1)[-1] if loc is not None else ""
              line = loc.get("line", "1") if loc is not None else "1"
              msg = i.get("message", "").replace("\n", " ")
              lvl = "error" if i.get("severity") in ("Error", "Fatal") else "warning"
              print(f"::{lvl} file=app/{f},line={line}::[{i.get('id')}] {msg}")
          PY

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RoshanKhata-debug-apk
          path: app/build/outputs/apk/debug/*.apk
