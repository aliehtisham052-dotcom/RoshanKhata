name: Android CI

on:
  push:
    # kmp-* (18 Oct): the Kotlin Multiplatform steps are built and tested
    # here before they reach main. Only main publishes the "latest" APK; a
    # kmp-* branch puts its APK on the separate "kmp-test" pre-release.
    branches: [ main, 'kmp-*' ]
    paths-ignore:
      - 'ci/**' 
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned, not ubuntu-latest: GitHub moves that label to Ubuntu 26.04
    # between 19 Oct and 19 Nov 2026, and the Android SDK this build uses
    # comes from the runner image. Move to 26.04 on purpose, after one trial
    # run on it, rather than find out from a red build on a release day.
    # All actions are on their Node 24 majors (Node 20 is end-of-life).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
          gradle-version: 8.14.3

      # Decode the stable release keystore from a repository secret. The key
      # itself is never committed — only its base64 form lives in Secrets, and
      # the decoded file exists only for the length of this run. A stable key is
      # what gives Google Sign-In one unchanging SHA-1 and lets the Play Store
      # accept future updates.
      - name: Decode keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/roshankhata-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/roshankhata-release.jks" >> $GITHUB_ENV

      # Correctness before packaging. The build step below only proves the
      # code compiles; these prove VoiceEntry still decides whose page an
      # amount lands on. A green APK containing a matcher that hands the
      # owner a stranger's ledger is not a green build.
      - name: Unit tests
        run: |
          set +e
          gradle testDebugUnitTest :shared:desktopTest --no-daemon --stacktrace 2>&1 | tee /tmp/test_output.txt
          EXIT=${PIPESTATUS[0]}
          exit $EXIT

      - name: Publish test failures
        if: failure()
        run: |
          if [ -f /tmp/test_output.txt ]; then
            echo "## Unit Test Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -iE "FAILED|expected:|actual:|AssertionError|^e: " /tmp/test_output.txt \
              | head -40 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            # Annotations reach us through the REST API even when log blobs do
            # not, which is the only channel that actually gets back here.
            # Plus Gradle's own "What went wrong" block: a plugin that fails to
            # apply names its cause only there (18 Oct, KSP on the shared module).
            # One annotation each, lines joined: GitHub shows only 10 error
            # annotations per step, and one line per annotation lost the
            # compiler's own errors behind Gradle's summary.
            errs=$(grep -iE "^e: |FAILED|AssertionError" /tmp/test_output.txt | head -40 | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$errs" ] && echo "::error title=Compiler and test errors::$errs"
            why=$(grep -A12 "What went wrong" /tmp/test_output.txt | grep -v "^--$" | head -14 | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$why" ] && echo "::error title=What went wrong::$why"
            true
          fi

          # The console only says a test FAILED and the exception's class —
          # not its message. A test stopped by an exception (not an assert)
          # therefore arrived here with no cause at all. The JUnit XML keeps
          # the full text, so publish each failure's message, its "Caused by"
          # lines and the frames in our own code, in chunks an annotation can
          # hold. Reporting only: never fails the step.
          set +e
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in list(tc.iter('failure')) + list(tc.iter('error')):
                      lines = [l.strip() for l in (fl.text or '').splitlines()]
                      keep = [l for l in lines if l and (not l.startswith('at ') or 'innovation313' in l)][:40]
                      name = tc.get('classname', '').split('.')[-1] + '.' + (tc.get('name') or '')
                      text = name + ': ' + ' | '.join(keep)
                      for i in range(0, min(len(text), 6000), 1500):
                          part = text[i:i + 1500].replace('%', '%25').replace('\r', '').replace('\n', ' ')
                          print('::error::' + part)
          PY

      - name: Build the dev APK (release code, R8, ARM)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +e
          # This APK is a private dev build the owner installs alongside (or
          # over) whatever is on Play, on his own phone. Android refuses to
          # install a package over one with an equal or higher versionCode --
          # the source versionCode is fixed for the real Play release, so a
          # sideloaded dev build with that same number can silently fail to
          # install once Play's own versionCode has moved past it. A
          # timestamp is always higher than any manually-incremented Play
          # number, so this build always wins that comparison.
          #
          # -PsideBySide=true gives it its own package (".dev") and the name
          # "Roshan Khata TEST": Play re-signs the published app with Google's
          # key, so a build signed with ours can never install OVER it. As a
          # separate app it sits beside the real one and leaves its books alone.
          #
          # "dev" (12 Oct, app size) is the RELEASE build's own code: R8 and
          # resource shrinking on, as Play receives it, ARM only (every phone
          # it goes to is ARM), with the ".dev" package and TEST name. So the
          # build tested every day is the build that ships, at half the size.
          # The on-device workflow runs the same build on the emulator first
          # (release-smoke), as R8's failures are runtime failures.
          DEV_VERSION_CODE=$(date +%s)
          echo "Dev build versionCode override: $DEV_VERSION_CODE"
          gradle assembleDev -PversionCodeOverride=$DEV_VERSION_CODE -PsideBySide=true --no-daemon --stacktrace 2>&1 | tee /tmp/build_output.txt
          EXIT=${PIPESTATUS[0]}
          exit $EXIT

      - name: Publish error (on failure)
        if: failure()
        run: |
          # The tests run before this; if they were what failed, there is no
          # build log to print and their own step has already reported.
          if [ ! -f /tmp/build_output.txt ]; then exit 0; fi
          echo "## Build Failure Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -120 /tmp/build_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Also emit each error line as a workflow annotation. Annotations come
          # back through the REST API even when log blobs do not, which is the
          # only channel that actually reaches us.
          grep -iE "^e: |error:|FAILURE:|Caused by|Unresolved reference|not found" /tmp/build_output.txt \
            | head -25 \
            | while IFS= read -r line; do
                clean=$(echo "$line" | tr -d '\r' | sed 's/%/%%/g')
                echo "::error::$clean"
              done

      - name: Rename APK
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/dev/*.apk out/RoshanKhata-latest.apk
          ls -lh out/
          # The size, every build, where it can be seen: a regression shows here first.
          python3 - <<'PY'
          import zipfile, collections
          z = zipfile.ZipFile('out/RoshanKhata-latest.apk')
          g = collections.Counter()
          for i in z.infolist():
              n = i.filename
              k = ('lib/' + n.split('/')[1]) if n.startswith('lib/') else 'dex' if n.endswith('.dex') else \
                  'assets' if n.startswith('assets/') else 'res' if n.startswith('res/') else n if n == 'resources.arsc' else 'other'
              g[k] += i.compress_size
          import os
          total = os.path.getsize('out/RoshanKhata-latest.apk')
          print(f"::notice title=APK size {total/1e6:.2f} MB::" + ", ".join(f"{k} {v/1e6:.2f}" for k, v in g.most_common()))
          PY

      # A rolling "latest" release: one clean, permanent download link that
      # always points at the newest build. No zip, no login, no digging
      # through Actions artifacts — just tap and install on the phone.
      - name: Publish to Releases
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Roshan Khata — Latest Build"
          body: |
            Latest development build of Roshan Khata.

            **Commit:** ${{ github.sha }}
            **Built:** ${{ github.event.head_commit.timestamp }}

            Tap `RoshanKhata-latest.apk` below to download and install.
            It installs as a separate app, "Roshan Khata TEST", beside the
            Play Store app, and does not touch the real app's data.
            You may need to allow installs from unknown sources.
          files: out/RoshanKhata-latest.apk
          make_latest: true

      # Android 7.0 (minSdk 24) compatibility, plus accessibility, RTL and
      # hardcoded-text checks (10 Oct). Runs after the APK is published and is
      # continue-on-error, so it can never hold back the download link.
      # A kmp-* branch's APK, for the owner to try on his phone before the
      # step is merged. Never the "latest" release (that is main's alone).
      - name: Publish a kmp branch APK to the kmp-test pre-release
        if: success() && startsWith(github.ref, 'refs/heads/kmp-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/RoshanKhata-latest.apk out/RoshanKhata-kmp-test.apk
          gh release view kmp-test >/dev/null 2>&1 || gh release create kmp-test --prerelease \
            --title "Roshan Khata - KMP test build" --notes "Test build from a kmp-* branch. Not the Play app, not the latest build." || true
          gh release upload kmp-test out/RoshanKhata-kmp-test.apk --clobber
          gh release edit kmp-test --notes "Test build from branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA}. Not the Play app, not the latest build."

      - name: Lint (old-Android API, accessibility, RTL, hardcoded text)
        if: success()
        continue-on-error: true
        run: |
          gradle lintDebug --no-daemon 2>&1 | tail -5
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("app/build/reports/lint-results-debug.xml")
          if not files:
              print("::warning::lint report not found"); raise SystemExit(0)
          issues = ET.parse(files[0]).getroot().findall("issue")
          print(f"Lint findings: {len(issues)}")
          from collections import Counter
          for k, n in Counter(i.get("id") for i in issues).most_common(): print(f"  {k}: {n}")
          for i in issues:
              loc = i.find("location")
              f = loc.get("file", "").split("/app/", 1)[-1] if loc is not None else ""
              line = loc.get("line", "1") if loc is not None else "1"
              msg = i.get("message", "").replace("\n", " ")
              lvl = "error" if i.get("severity") in ("Error", "Fatal") else "warning"
              print(f"::{lvl} file=app/{f},line={line}::[{i.get('id')}] {msg}")
          PY

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: RoshanKhata-dev-apk
          path: app/build/outputs/apk/dev/*.apk

      # R8 renames the code: without this map a crash from the owner's phone
      # reads a(), b(), c(). It belongs to this one build and cannot be made later.
      - name: Upload R8 mapping
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: RoshanKhata-dev-r8-mapping
          path: app/build/outputs/mapping/dev/
          retention-days: 90
